[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<tests/>

lib_deps =
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    adafruit/Adafruit BusIO @ ^1.16.1
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    links2004/WebSockets @ ^2.4.1

; בדיקות עצמאיות - כל אחת נבנית לבד, בלי הקוד הראשי
[env:relay2_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tests/relay2_test.cpp>

[env:relay_single_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tests/relay_single_test.cpp>

[env:spi_lines_diag]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tests/spi_lines_diag.cpp>

; סטטיסטיקה על הפינים - 500 חזרות + בדיקת pull חיצוני, כולל קו ביקורת
[env:pin_stats_diag]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tests/pin_stats_diag.cpp>

[env:pt100_only_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tests/pt100_only_test.cpp>
lib_deps =
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    adafruit/Adafruit BusIO @ ^1.16.1

; דף web: 2 כפתורי הדלקה/כיבוי למשאבות (GPIO26/25) + 2 טמפרטורות חיות,
; מוגש דרך WebSocket אמיתי (פורט 81) - שודרג מ-HTTP polling ב-2026-09-07.
; WiFi.h/WebServer.h הם חלק מה-framework, לא צריך lib_deps נוסף בשבילם.
[env:pump_web_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tests/pump_web_test.cpp>
lib_deps =
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    adafruit/Adafruit BusIO @ ^1.16.1
    links2004/WebSockets @ ^2.4.1

; AP+STA stability test (see ap-sta-stability-test-spec.md) - runs the same
; AP as the real firmware plus a STA connection to the home network, to
; check whether the two interfere with each other before any UI is built
; around it. Needs src/tests/wifi_credentials.h (gitignored, not present in
; git) with the real home WiFi SSID/password filled in - see that file.
[env:ap_sta_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tests/ap_sta_test.cpp>

; Follow-up to ap_sta_test.cpp: does the Serial corruption seen under
; AP+STA radio load also affect real WebSocket JSON messages, or is it a
; UART-only artifact? The browser itself counts message integrity, so the
; result doesn't depend on Serial - see the file's own comment.
[env:ap_sta_ws_integrity_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tests/ap_sta_ws_integrity_test.cpp>
lib_deps =
    links2004/WebSockets @ ^2.4.1
