[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<tests/>
; Brewfather's HTTPS/TLS + JSON stack pushed the app past the default
; partition table's 1.25MB-per-OTA-slot app size (99.9% full, no OTA is
; ever used in this project). min_spiffs keeps the same 2-slot layout but
; gives each app slot ~1.97MB instead, shrinking SPIFFS to ~128KB - still
; far more than the few KB of recipes/WiFi/Brewfather settings it holds.
; NOTE: this moves where SPIFFS lives on the flash - the next flash after
; this change needs a full chip erase, or old SPIFFS data will be read
; from the wrong offset.
board_build.partitions = min_spiffs.csv

lib_deps =
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    adafruit/Adafruit BusIO @ ^1.16.1
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0

; בדיקות עצמאיות - כל אחת נבנית לבד, בלי הקוד הראשי
[env:relay2_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<tests/relay2_test.cpp>

[env:relay_single_test]
platform = espressif32
board = esp32dev
