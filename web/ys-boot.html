<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YS Smart Brew</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     פלטת צבעים חדשה - עודכנה יחד עם החלפת הלוגו (אותה החלטה אחת,
     לא שני שינויים נפרדים). כתום/טורקיז = צבעי מותג, לפי הלוגו.
     ירוק/אדום נשארים שמורים אך ורק לסטטוס בטיחות (High Performance
     HMI) - לא נעשה בהם שימוש בכלל במסכי הבוט/תפריט האלה, כי אין
     כאן שום דבר בטיחותי להציג.
     ============================================================ */
  :root {
    --bg-primary:   #1a1f2e; /* היה #080808 - שחור טהור */
    --text-primary: #ffffff;
    --text-dim:     #888888;
    --text-dimmer:  #444444;
    --brand-orange: #f5941f;
    --brand-teal:   #2a9d9d;
    --border-dim:   #2a3040;
    --panel-bg:     #12151f;
  }

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:var(--bg-primary); overflow:hidden; -webkit-font-smoothing:antialiased; }

  #boot {
    position:fixed; inset:0; background:var(--bg-primary);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:100; transition:opacity 1s ease;
  }
  #boot.out { opacity:0; pointer-events:none; }
  #boot::after {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 40%, var(--bg-primary) 100%);
    pointer-events:none;
  }

  .logo-wrap {
    opacity:0;
    animation:logoIn 1s cubic-bezier(0.2,0,0.2,1) forwards 0.4s;
    position:relative; z-index:1;
  }
  @keyframes logoIn {
    from { opacity:0; transform:scale(0.88); filter:blur(10px); }
    to   { opacity:1; transform:scale(1);    filter:blur(0); }
  }

  /* לוגו מלא - קובץ תמונה (PNG שקוף), לא SVG כמו קודם.
     אי אפשר יותר לשלוט בצבע דרך fill בקוד - הצבע כבר "אפוי" בתוך
     הקובץ. לכן אין כאן עוד תלות ב-fill/currentColor. */
  .logo-svg {
    width: 320px;
    height: 320px;
    display:block;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(245,148,31,0.12));
  }

  .boot-status {
    margin-top:28px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    opacity:0; animation:fadeUp 0.5s ease forwards 1.1s;
    position:relative; z-index:1;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .boot-label {
    font-family:'Share Tech Mono',monospace;
    font-size:11px; letter-spacing:3px; color:var(--text-dim);
    text-transform:uppercase; min-height:16px;
  }
  .bar-track { width:200px; height:1px; background:var(--border-dim); overflow:hidden; }
  .bar-fill {
    height:100%; width:0%; background:var(--brand-orange);
    box-shadow:0 0 8px rgba(245,148,31,0.5);
    animation:barFill 9s cubic-bezier(0.3,0,0.4,1) forwards 0.8s;
  }
  @keyframes barFill {
    0%  {width:0%}
    10% {width:8%}
    25% {width:22%}
    45% {width:40%}
    60% {width:58%}
    75% {width:72%}
    88% {width:84%}
    100%{width:100%}
  }

  .boot-ver {
    position:absolute; bottom:20px; z-index:1;
    font-family:'Share Tech Mono',monospace;
    font-size:10px; letter-spacing:2px; color:var(--text-dimmer);
  }

  /* ══ MENU ══ */
  #menu {
    display:none; position:fixed; inset:0;
    background:var(--bg-primary);
    flex-direction:column; align-items:center; justify-content:center;
  }
  #menu.visible { display:flex; animation:menuIn 0.6s ease; }
  @keyframes menuIn { from{opacity:0} to{opacity:1} }

  .topbar {
    position:absolute; top:0; left:0; right:0; height:46px;
    background:var(--panel-bg); border-bottom:1px solid var(--border-dim);
    display:flex; align-items:center; padding:0 18px; gap:10px;
  }
  /* topbar: רק סמל ה-hop (בלי הטבעת/טקסט) - קובץ נפרד, לא viewBox
     חתוך כמו שהיה אפשרי עם ה-SVG הישן. ראה הערה על מגבלה זו למטה. */
  .topbar-logo { height:28px; width:auto; object-fit:contain; opacity:0.9; }
  .topbar-right { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .online-dot {
    width:6px; height:6px; border-radius:50%;
    background:var(--brand-teal); box-shadow:0 0 5px rgba(42,157,157,0.6);
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
  .online-txt { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--text-dim); }
  .ip-txt     { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--text-dimmer); }

  .menu-heading { display:flex; align-items:center; gap:14px; margin-bottom:24px; margin-top:6px; }
  .h-line { width:44px; height:1px; background:linear-gradient(90deg,transparent,var(--border-dim)); }
  .h-line.r { background:linear-gradient(90deg,var(--border-dim),transparent); }
  .h-text {
    font-family:'Rajdhani',sans-serif;
    font-size:12px; font-weight:500; letter-spacing:5px;
    color:var(--text-dimmer); text-transform:uppercase;
  }

  .menu-list { display:flex; flex-direction:column; gap:8px; width:min(400px,88vw); }
  .mbtn {
    display:flex; align-items:center; gap:14px;
    background:var(--panel-bg); border:1px solid var(--border-dim);
    border-radius:4px; padding:14px 16px;
    cursor:pointer; transition:all 0.15s ease;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .mbtn:hover,.mbtn:active { border-color:var(--brand-orange); background:#161a26; }
  .mbtn:active { transform:scale(0.98); }
  .mbtn-icon {
    width:32px; height:32px; border-radius:3px;
    background:#161a26; border:1px solid var(--border-dim);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; flex-shrink:0; filter:grayscale(1);
  }
  .mbtn-body { flex:1; }
  .mbtn-title {
    font-family:'Rajdhani',sans-serif;
    font-size:14px; font-weight:600; letter-spacing:2px;
    color:#ccc; text-transform:uppercase;
  }
  .mbtn-sub { font-size:10px; color:var(--text-dimmer); letter-spacing:1px; margin-top:1px; }
  .mbtn-arr { font-size:16px; color:var(--text-dimmer); transition:all 0.15s ease; }
  .mbtn:hover .mbtn-arr { color:var(--brand-orange); transform:translateX(3px); }

  .menu-ver {
    position:absolute; bottom:18px;
    font-family:'Share Tech Mono',monospace;
    font-size:10px; letter-spacing:2px; color:var(--border-dim);
  }
</style>
</head>
<body>

<!-- ══ BOOT ══ -->
<div id="boot">
  <div class="logo-wrap">
    <!-- לוגו מלא: עיגול + סמל hop + YS BREW + טקסט קטן, שקוף אמיתי -->
    <img class="logo-svg" src="ys-logo-full.png" alt="YS Brew - Smart Brew Controller">
  </div>

  <div class="boot-status">
    <div class="boot-label" id="boot-label">Starting system...</div>
    <div class="bar-track"><div class="bar-fill"></div></div>
  </div>

  <div class="boot-ver">YS SMART BREW &middot; v1.0</div>
</div>

<!-- ══ MENU ══ -->
<div id="menu">
  <div class="topbar">
    <!-- topbar: רק סמל ה-hop, קובץ נפרד וחתוך מראש (לא viewBox דינמי -
         זו תמונה, לא וקטור. אם נרצה בעתיד לשלוט על הצבע/לחתוך
         דינמית, נצטרך להמיר סופית ל-SVG - נדחה בכוונה לשלב מאוחר
         יותר, כפי שסוכם). -->
    <img class="topbar-logo" src="ys-logo-topbar.png" alt="YS">
    <div class="topbar-right">
      <div class="online-dot"></div>
      <div class="online-txt">ONLINE</div>
      <div class="ip-txt">192.168.4.1</div>
    </div>
  </div>

  <div class="menu-heading">
    <div class="h-line"></div>
    <div class="h-text">Select Brew Mode</div>
    <div class="h-line r"></div>
  </div>

  <div class="menu-list">
    <div class="mbtn">
      <div class="mbtn-icon">📋</div>
      <div class="mbtn-body">
        <div class="mbtn-title">Load Recipe</div>
        <div class="mbtn-sub">Load a saved recipe from memory</div>
      </div>
      <div class="mbtn-arr">›</div>
    </div>
    <div class="mbtn">
      <div class="mbtn-icon">⬇</div>
      <div class="mbtn-body">
        <div class="mbtn-title">Import Recipe</div>
        <div class="mbtn-sub">Import from Brewfather (JSON)</div>
      </div>
      <div class="mbtn-arr">›</div>
    </div>
    <div class="mbtn">
      <div class="mbtn-icon">⚙</div>
      <div class="mbtn-body">
        <div class="mbtn-title">Manual Mode</div>
        <div class="mbtn-sub">Direct control of all systems</div>
      </div>
      <div class="mbtn-arr">›</div>
    </div>
  </div>

  <div class="menu-ver">YS SMART BREW &middot; v1.0</div>
</div>

<script>
const lblEl = document.getElementById('boot-label');
setTimeout(()=>lblEl.textContent='System ready.', 8500);

setTimeout(()=>{
  document.getElementById('boot').classList.add('out');
  setTimeout(()=>{
    document.getElementById('boot').style.display='none';
    document.getElementById('menu').classList.add('visible');
  }, 1000);
}, 10200);
</script>
</body>
</html>
